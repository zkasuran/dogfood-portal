<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DOGFOOD portal{% endblock %}</title>
  <style>
    :root {
      --bg: #f7f7f5; --panel: #ffffff; --ink: #1a1a1a; --muted: #5f5f5f;
      --line: #e3e3df; --accent: #2d6a4f; --chip: #eef2f0;
    }
    html[data-theme="dark"] {
      --bg: #14171a; --panel: #1c2024; --ink: #eef0f2; --muted: #9aa3ab;
      --line: #2c3238; --accent: #74c69d; --chip: #22282d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px; border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    header h1 { font-size: 18px; margin: 0; }
    header a { color: var(--accent); text-decoration: none; margin-left: 16px; }
    main { max-width: 960px; margin: 0 auto; padding: 24px; }
    .toggle {
      cursor: pointer; border: 1px solid var(--line); background: var(--chip);
      color: var(--ink); border-radius: 8px; padding: 6px 10px; font-size: 13px;
    }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 16px 18px; margin: 12px 0;
    }
    .card h3 { margin: 0 0 4px; font-size: 16px; }
    .muted { color: var(--muted); font-size: 13px; }
    .chip {
      display: inline-block; background: var(--chip); border-radius: 999px;
      padding: 2px 10px; font-size: 12px; color: var(--muted); margin-right: 6px;
    }
    .flag { color: #b45309; font-weight: 600; }
    form.search { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    input, select {
      padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--panel); color: var(--ink);
    }
    button.go {
      padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent);
      color: #fff; cursor: pointer;
    }
  </style>
  <script>
    (function () {
      var saved = localStorage.getItem("dogfood-theme");
      var t = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
    })();
    function toggleTheme() {
      var el = document.documentElement;
      var t = el.getAttribute("data-theme") === "dark" ? "light" : "dark";
      el.setAttribute("data-theme", t);
      localStorage.setItem("dogfood-theme", t);
    }
  </script>
</head>
<body>
  <header>
    <h1>DOGFOOD portal</h1>
    <nav>
      <a href="/projects">Gallery</a>
      <a href="/api/docs">API</a>
      <a href="/admin/">Organizer console</a>
      <button class="toggle" onclick="toggleTheme()">Theme</button>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
